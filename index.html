      <section>
        <h2>Frequently Asked Questions</h2>
        <details>
          <summary>How does Neuron Mapping keep my thoughts organized?</summary>
          <p>Neuron Mapping provides a large, distraction-free canvas where you can build node hierarchies. You can color-code your branches, choose custom connection layouts (curved, straight, stepped), write extensive markdown-formatted notes, draw sketches directly on nodes, and attach icons from a library.</p>
        </details>
        <details>
          <summary>Where is my data stored? Does it upload to the cloud?</summary>
          <p>Your data is 100% secure and private. Neuron Mapping runs on a strict 'Local-First, Privacy-Absolute' architecture. All mind maps, templates, auto-saves, and custom settings are saved client-side on your local device via IndexedDB. We have zero servers, zero telemetry trackers, and zero cloud uploads.</p>
        </details>
        <details>
          <summary>Can I export my mind maps to other formats?</summary>
          <p>Absolutely. You can export your maps as .nmm files (our native JSON structure) for backups or sharing. You can also export high-resolution PNG images or vector PDF files directly from the browser or desktop app.</p>
        </details>
        <details>
          <summary>Is Neuron Mapping really a free brain mapping tool?</summary>
          <p>Yes. Neuron Mapping is a 100% free, open-source brain mapping tool licensed under GNU AGPLv3. There are no paywalls, no subscriptions, and no map size limitations. Run it online, install the desktop app, or self-host.</p>
        </details>
        <details>
          <summary>Can I do brain mapping online with complete privacy?</summary>
          <p>Absolutely. Neuron Mapping is designed as a local-first online brain mapping tool. All your mind maps and configurations are stored inside your browser's IndexedDB. We have no tracking cookies, no server uploads, and no analytics.</p>
        </details>
        <details>
          <summary>How does this compare to other open source mind mapping tools?</summary>
          <p>Unlike standard open source mind mapping tools, Neuron Mapping features an interactive 3D Galaxy View that lets you visualize node connections as WebGL-powered particle constellations. It also includes 20+ pre-built business and planning templates, offline capabilities, and a full distraction-free canvas.</p>
        </details>
